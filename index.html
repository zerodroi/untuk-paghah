<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Farah</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.rawgit.com/blasten/turn.js/master/turn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');
        body { background: #0b0b0b; color: #eee; font-family: 'Special Elite', serif; overflow: hidden; margin: 0; }
        #album { width: 350px; height: 500px; display: none; margin: auto; }
        .page { width: 350px; height: 500px; background-color: #1a1a1a; box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; }
        .page img { width: 100%; height: 70%; object-fit: cover; border-bottom: 2px solid #333; }
        .text-box { padding: 15px; font-size: 13px; line-height: 1.5; color: #ddd; min-height: 100px; }
        .cover { background: linear-gradient(45deg, #450a0a, #1a0000); display: flex; align-items: center; justify-content: center; border: 5px solid #7f1d1d; }
        .final-paper { background: #fdfdfd; color: #1a1a1a; padding: 25px; height: 100%; font-size: 12px; line-height: 1.6; }
        #start-screen { height: 100vh; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .cursor { border-right: 2px solid #991b1b; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { border-color: transparent; } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <audio id="mySong" src="public/song.mp3" loop></audio>

    <div id="start-screen" onclick="initAlbum()">
        <p class="text-xl italic opacity-50 animate-pulse">love should be fun</p>
    </div>

    <div id="album">
        <div class="page cover">
            <h2 class="text-2xl font-bold text-red-700">FOR FARAH</h2>
        </div>

        <div id="photo-pages"></div>

        <div class="page">
            <div class="final-paper">
                <div id="type-f1"></div>
            </div>
        </div>

        <div class="page">
            <div class="final-paper">
                <div id="type-f2"></div>
                <div class="mt-4 text-red-800 font-bold text-right text-xs">- Your Red Rose -</div>
            </div>
        </div>
    </div>

    <script>
        const messages = [
            "Meeting you is honestly one of the luckiest things that ever happened to me, because someone as beautiful as you isn’t easy to find",
            "sometimes i still can’t believe life actually let me meet someone like you, beautiful in a way that makes everything else feel less impressive",
            "there are so many people in this world, but somehow i ended up meeting the most beautiful one, feels like i got really lucky",
            "if someone asked me what real beauty looks like, i’d probably just think about you and smile",
            "crossing paths with you feels like one of those rare lucky moments in life that people don’t usually get twice",
            "every time i think about how we met, it just makes me realize how lucky i actually am",
            "people always talk about beautiful things in the world, but somehow none of them ever remind me of anyone except you",
            "sometimes i just sit there smiling because i remember that out of everyone in this world, i met you",
            "the funny thing about life is that it randomly brought someone as beautiful as you into my world",
            "if luck was a real person, it probably looked like the moment i met you",
            "honestly, knowing someone like you already feels like winning something rare",
            "the world is big, but somehow it still led me straight to someone as beautiful as you",
            "sometimes beauty is hard to define, but thinking about you makes it pretty simple",
            "life really surprised me the day it decided i should meet someone like you",
            "and yeah… my skills are pretty cool too, right 😏"
        ];

        const letter1 = `i just want you to know something, and i mean it with all my heart, you’re really, really beautiful, not just in the normal way people say it, but in a way that actually makes someone stop and smile when they think about you\n\nsometimes when i look at things like sunsets, people always say sunsets are the definition of beauty, the sky turning orange and pink, everything looking calm and perfect for a moment, but honestly, even sunsets can’t really compare to you...`;
        
        const letter2 = `because a sunset only lasts for a little while, but the beauty you have stays in my mind way longer than that\n\nand it’s not just about how you look, it’s also the way you exist in my life, the way you make simple moments feel special. that’s why i say you’re my red rose, because to me you’re something rare and precious.\n\nso yeah, maybe people will keep saying sunsets are beautiful, but for me it’s different, karena mawar merahku cuma kamu.`;

        function initAlbum() {
            $('#start-screen').hide();
            $('#album').show();
            document.getElementById('mySong').play();

            const photoPages = $('#photo-pages');
            for (let i = 1; i <= 15; i++) {
                photoPages.append(`
                    <div class="page">
                        <img src="public/foto${i}.jpg" onerror="this.src='https://via.placeholder.com/350x500?text=Foto+${i}'">
                        <div class="text-box"><span id="type-${i}"></span><span class="cursor"></span></div>
                    </div>
                `);
            }

            $("#album").turn({
                width: 350, height: 500, autoCenter: true, gradients: true,
                when: {
                    turned: function(e, page) {
                        if (page > 1 && page <= 16) {
                            typeWriter(messages[page-2], `type-${page-1}`);
                        } else if (page === 17) {
                            typeWriter(letter1, 'type-f1', 30);
                        } else if (page === 18) {
                            typeWriter(letter2, 'type-f2', 30);
                        }
                    }
                }
            });
        }

        function typeWriter(text, elementId, speed = 50) {
            let i = 0; const el = document.getElementById(elementId);
            if(!el || el.innerHTML !== "") return; 
            function type() {
                if (i < text.length) { el.innerHTML += text.charAt(i); i++; setTimeout(type, speed); }
            }
            type();
        }
    </script>
</body>
</html>
