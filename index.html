<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Farah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');
        body { background-color: #0f0f0f; color: #d1d1d1; font-family: 'Special Elite', cursor; overflow: hidden; }
        .page { display: none; height: 100vh; width: 100vw; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .active { display: flex; }
        .typewriter { border-right: 2px solid white; white-space: pre-wrap; overflow: hidden; animation: blink 0.7s infinite; }
        @keyframes blink { 50% { border-color: transparent; } }
        img { max-width: 80%; max-height: 50vh; border-radius: 8px; filter: grayscale(50%) contrast(1.1); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <audio id="mySong" src="public/song.mp3" loop></audio>

    <div class="page active" onclick="nextSlide(1)">
        <img src="public/foto1.jpg" alt="Farah">
        <div id="text1" class="text-lg"></div>
        <p class="mt-10 text-xs opacity-30 text-white">Tap to continue...</p>
    </div>

    <div class="page" onclick="nextSlide(2)">
        <img src="public/foto2.jpg">
        <div id="text2" class="text-lg"></div>
    </div>

    <div class="page" onclick="nextSlide(3)">
        <div class="bg-white text-black p-8 rounded shadow-2xl max-w-sm rotate-1 relative">
            <div id="finalText" class="text-sm leading-loose"></div>
            <div class="absolute bottom-4 right-6 text-xs opacity-50">- Mawar Merahmu</div>
        </div>
    </div>

    <script>
        const messages = [
            "i hope you read this, even if it's too late.",
            "I still think about you sometimes...",
            "We both tried. We both cared. But I just wonder... if we had met at a different point in life, would the ending have been different?\n\nAnyway, I hope you're doing okay."
        ];

        let currentSlide = 0;
        const pages = document.querySelectorAll('.page');
        const song = document.getElementById('mySong');

        function typeWriter(text, elementId, speed = 50) {
            let i = 0;
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // Mulai ketikan pertama
        window.onload = () => {
            typeWriter(messages[0], 'text1');
        };

        function nextSlide(index) {
            // Putar musik saat pertama kali layar disentuh
            song.play().catch(() => {});

            if (index < pages.length) {
                pages[currentSlide].classList.remove('active');
                pages[index].classList.add('active');
                currentSlide = index;

                if (index === 1) typeWriter(messages[1], 'text2');
                if (index === 2) typeWriter(messages[2], 'finalText', 40);
            }
        }
    </script>
</body>
</html>
